<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đăng nhập – Kem Đoàn</title>
<link rel="icon" href="img/kdicon.png">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/misans@5.0.0/lib/Normal/MiSansVF.min.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="login-register.css">
<style>
  /* ===== Card giới thiệu (nền --black) ===== */
  .intro {
    display: flex;
    flex-direction: column;
    gap: 28px;
    overflow: hidden;
  }

  .intro-head { max-width: 30em; }

  .intro-title {
    margin: 0;
    font-size: 25px;
    font-weight: 900;
    line-height: 1.3;
    letter-spacing: -0.5px;
    text-wrap: balance;
  }

  .intro-sub {
    margin: 14px 0 0;
    font-size: 15px;
    line-height: 1.3;
    color: rgba(255, 255, 255, 0.74);
    text-wrap: pretty;
  }

  /* ===== Cụm ảnh xếp chồng nghiêng, khung 16:9 ===== */
  .fan {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    container-type: inline-size;
    margin: 0;
  }

  .photo {
    position: absolute;
    left: var(--x);
    top: var(--y);
    width: 44cqw;
    aspect-ratio: 16 / 9;
    transform: translate(-50%, -50%) rotate(var(--r));
    z-index: var(--z);
    border: 0.8cqw solid #f1f1f1;
    border-radius: 3.5cqw;
    overflow: hidden;
    isolation: isolate;
    background: var(--mesh-b);
    box-shadow: 0 2cqw 4cqw rgba(0, 0, 0, 0.4);
  }
  .photo > img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: 1;
  }

  /* Mẫu chữ dự phòng khi chưa có ảnh */
  .specimen {
    position: absolute;
    inset: 0;
    z-index: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--black);
    line-height: 1.3;
  }
  .photo.has-img .specimen { visibility: hidden; }
  .specimen span { font-size: 11cqw; }

  .sp-hand  { background: var(--mesh-a); }
  .sp-hand span  { font-family: "Segoe Script", "Bradley Hand", "Brush Script MT", cursive; font-size: 9cqw; }
  .sp-wed   { background: var(--mesh-b); }
  .sp-wed span   { font-family: "Snell Roundhand", "Apple Chancery", "Palatino Linotype", Georgia, serif; font-style: italic; }
  .sp-brand { background: var(--mesh-c); }
  .sp-brand span { font-family: 'MiSans VF', sans-serif; font-weight: 900; letter-spacing: -0.5px; }

  .intro-cta {
    align-self: center;
    padding: 14px 28px;
    background: var(--white);
    color: var(--black);
  }
  .intro-cta:focus-visible { outline: 2px solid var(--white); outline-offset: 3px; }


  /* ===== Riêng trang đăng nhập ===== */
  .login-btn-row { margin-top: 14px; }
  .login-or {
    width: 100%; display: flex; align-items: center; gap: 10px;
    margin: 14px 0 12px; font-size: 14px; color: var(--black); opacity: .7;
  }
  .login-or::before, .login-or::after { content: ''; flex: 1; height: 1px; background: currentColor; opacity: .4; }
  .login-or[hidden], .google-btn-wrap[hidden] { display: none; }
  .google-btn-wrap { width: 100%; display: flex; justify-content: center; min-height: 44px; }

</style>
</head>
<body class="login-page">

  <header class="login-page-logo">
    <a href="/" style="display:flex;align-items:center;gap:14px;text-decoration:none;color:inherit" aria-label="Kem Đoàn – trang chủ">
      <img src="img/kdblack.png" alt="" class="logo-img">
      <span class="logo-text">
        <span class="logo-name">KEM ĐOÀN</span>
        <span class="logo-slogan">Font Việt hóa</span>
      </span>
    </a>
  </header>

  <main class="stage">

    <!-- Bên trái: card giới thiệu -->
    <section class="intro" aria-labelledby="intro-title">
      <div class="intro-head">
        <h1 class="intro-title" id="intro-title">Đăng ký thành viên<br>150.000đ / 1 năm<br>Để tải thỏa thích không giới hạn</h1>
        <p class="intro-sub">Font được Việt hóa đầy đủ, nhiều style thích hợp cho thiết kế như: Thiệp cưới, Viết tay, Logo, Poster, Thumbnail...</p>
      </div>

      <!--
        Thay 3 ảnh bằng ảnh thật (tỉ lệ 16:9, ảnh khác tỉ lệ sẽ tự cắt vừa khung).
        Chưa có ảnh thì mỗi thẻ tự hiện mẫu chữ dự phòng.
      -->
      <div class="fan" role="group" aria-label="Các dạng thiết kế dùng font Kem Đoàn">
        <figure class="photo sp-hand" style="--x:29cqw;--y:22cqw;--r:-7deg;--z:2;margin:0">
          <div class="specimen" aria-hidden="true"><span>Aa</span></div>
          <img src="imgdemo/kdnetsera.jpg" alt="Chữ viết tay dùng font Kem Đoàn" loading="lazy" onload="this.parentNode.classList.add('has-img')" onerror="this.remove()">
        </figure>
        <figure class="photo sp-wed" style="--x:50cqw;--y:33cqw;--r:2deg;--z:3;margin:0">
          <div class="specimen" aria-hidden="true"><span>Aa</span></div>
          <img src="imgdemo/kddoannguyen.jpg" alt="Thiệp cưới dùng font Kem Đoàn" loading="lazy" onload="this.parentNode.classList.add('has-img')" onerror="this.remove()">
        </figure>
        <figure class="photo sp-brand" style="--x:71cqw;--y:21cqw;--r:8deg;--z:1;margin:0">
          <div class="specimen" aria-hidden="true"><span>Aa</span></div>
          <img src="imgdemo/kdmarthi.jpg" alt="Nhận diện thương hiệu dùng font Kem Đoàn" loading="lazy" onload="this.parentNode.classList.add('has-img')" onerror="this.remove()">
        </figure>
      </div>

      <a class="btn intro-cta" href="/dang-ky"><i class="ri-user-add-line"></i> Đăng ký thành viên</a>
    </section>

    <!-- Bên phải: card đăng nhập -->
    <section class="login-col" aria-label="Đăng nhập">
      <div class="popup-card" id="login-card">
        <div class="login-title">ĐĂNG NHẬP</div>
        <div class="popup-field">
          <i class="ri-user-line popup-field-icon"></i>
          <input class="popup-input" type="email" id="login-email" name="username" autocomplete="username" placeholder="Tài khoản" autocapitalize="off" autocorrect="off" spellcheck="false">
        </div>
        <div class="popup-field">
          <i class="ri-lock-line popup-field-icon"></i>
          <input class="popup-input" type="password" id="login-password" name="password" autocomplete="current-password" placeholder="Mật khẩu">
        </div>
        <div class="popup-field" id="change-pass-extra" hidden>
          <i class="ri-lock-line popup-field-icon"></i>
          <input class="popup-input" type="password" id="new-password" name="new-password" autocomplete="new-password" placeholder="Mật khẩu mới">
        </div>
        <div class="popup-btn-row login-btn-row">
          <!-- <button class="btn popup-btn" id="change-pass-btn"><i class="ri-key-2-line"></i> Đổi Pass</button> -->
          <button class="btn popup-btn" id="login-btn"><i class="ri-arrow-right-line"></i> Đăng nhập</button>
        </div>
        <div class="login-or" id="google-or"><span>Hoặc</span></div>
        <div class="google-btn-wrap" id="google-btn"></div>
        <div class="popup-toast" id="login-error" role="status" aria-live="polite"></div>
      </div>
    </section>

  </main>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="login-register.js"></script>
<script>
(() => {
'use strict';

const { HOME_URL, $, setToken, setProfile, postJson, SPINNER } = KD;
const GOOGLE_CLIENT_ID = '704991012160-k1f0s7qojcojdeoshnrf6pdhpurse2a1.apps.googleusercontent.com';

const loginEmail = $('login-email');
const loginPassword = $('login-password');
const newPasswordInput = $('new-password');
const changePassExtra = $('change-pass-extra');
const loginBtn = $('login-btn');
const changePassBtn = $('change-pass-btn');
const loginError = $('login-error');

const LABEL = {
  login: '<i class="ri-arrow-right-line"></i> Đăng nhập',
  changePass: '<i class="ri-key-2-line"></i> Đổi Pass',
  confirm: '<i class="ri-check-line"></i> Xác nhận',
  back: '<i class="ri-arrow-left-line"></i> Quay lại'
};

let changePassMode = false;
let loginErrorTimer = null;

function showLoginError(msg) {
  loginError.textContent = msg;
  clearTimeout(loginErrorTimer);
  loginErrorTimer = setTimeout(() => { loginError.textContent = ''; }, 3000);
}

function showLoginLoading(msg) {
  clearTimeout(loginErrorTimer);
  loginError.innerHTML = SPINNER + ' ' + msg;
}

function onLoginSuccess(token, profile) {
  setToken(token);
  if (profile && profile.email) setProfile(profile);
  window.location.replace(HOME_URL);
}

async function doLogin() {
  const email = loginEmail.value.trim().toLowerCase();
  const password = loginPassword.value;
  loginError.textContent = '';

  if (!email || !password) {
    showLoginError('Vui lòng nhập email và mật khẩu.');
    return;
  }

  loginBtn.disabled = true;
  loginBtn.innerHTML = SPINNER;

  try {
    const data = await postJson('/api/login', { email, password, mode: 'login' });
    if (data.ok) {
      onLoginSuccess(data.token, { email, avatar: data.avatar, name: data.name });
      return;
    }
    showLoginError(data.error === 'wrong_password' ? 'Sai mật khẩu' : 'Tài khoản không tồn tại.');
  } catch (e) {
    showLoginError('Lỗi kết nối, hãy thử lại sau.');
  }
  loginBtn.disabled = false;
  loginBtn.innerHTML = LABEL.login;
}

function enterChangePassMode() {
  changePassMode = true;
  changePassExtra.hidden = false;
  changePassBtn.innerHTML = LABEL.confirm;
  loginBtn.innerHTML = LABEL.back;
}

function exitChangePassMode() {
  changePassMode = false;
  changePassExtra.hidden = true;
  newPasswordInput.value = '';
  changePassBtn.innerHTML = LABEL.changePass;
  loginBtn.innerHTML = LABEL.login;
}

async function doChangePassword() {
  const email = loginEmail.value.trim().toLowerCase();
  const oldPassword = loginPassword.value;
  const newPassword = newPasswordInput.value;

  if (!email || !oldPassword || !newPassword) {
    showLoginError('Vui lòng nhập đầy đủ thông tin.');
    return;
  }

  changePassBtn.disabled = true;
  loginBtn.disabled = true;
  changePassBtn.innerHTML = SPINNER;

  try {
    const data = await postJson('/api/change-password', { email, oldPassword, newPassword });
    if (data.ok) {
      showLoginError('Đổi mật khẩu thành công.');
      exitChangePassMode();
    } else if (data.error === 'wrong_password') {
      showLoginError('Mật khẩu hiện tại không đúng.');
    } else if (data.error === 'not_found') {
      showLoginError('Tài khoản không tồn tại.');
    } else {
      showLoginError('Có lỗi xảy ra, hãy thử lại sau.');
    }
  } catch (e) {
    showLoginError('Lỗi kết nối, hãy thử lại sau.');
  } finally {
    changePassBtn.disabled = false;
    loginBtn.disabled = false;
    if (changePassMode) changePassBtn.innerHTML = LABEL.confirm;
  }
}

/* ---------- Google ---------- */
const googleBtnEl = $('google-btn');
const googleOrEl = $('google-or');
let googleReady = false;
let googleRenderedWidth = 0;

async function onGoogleCredential(resp) {
  if (!resp || !resp.credential) return;
  showLoginLoading('Đang đăng nhập...');
  try {
    const data = await postJson('/api/google-login', { credential: resp.credential });
    if (data.ok) {
      onLoginSuccess(data.token, { email: data.email, avatar: data.avatar, name: data.name, picture: data.picture });
    } else if (data.error === 'not_registered') {
      showLoginError('Tài khoản chưa được đăng ký');
    } else {
      showLoginError('Đăng nhập Google thất bại');
    }
  } catch (e) {
    showLoginError('Lỗi kết nối, hãy thử lại sau');
  }
}

function initGoogle() {
  if (googleReady || !(window.google && google.accounts && google.accounts.id)) return;
  google.accounts.id.initialize({
    client_id: GOOGLE_CLIENT_ID,
    callback: onGoogleCredential,
    ux_mode: 'popup',
    auto_select: false
  });
  googleReady = true;
}

function renderGoogleBtn() {
  initGoogle();
  const hide = !googleReady;
  googleBtnEl.hidden = hide;
  googleOrEl.hidden = hide;
  if (hide) return;
  const w = Math.min(400, Math.max(200, Math.round(googleBtnEl.parentElement.clientWidth - 60) || 240));
  if (w === googleRenderedWidth) return;
  googleRenderedWidth = w;
  googleBtnEl.innerHTML = '';
  google.accounts.id.renderButton(googleBtnEl, {
    type: 'standard', theme: 'outline', size: 'large',
    text: 'signin_with', shape: 'pill', logo_alignment: 'left', width: w
  });
}

window.onGoogleLibraryLoad = renderGoogleBtn;
googleBtnEl.hidden = true;
googleOrEl.hidden = true;
window.addEventListener('resize', () => { if (googleReady) renderGoogleBtn(); });

/* ---------- Sự kiện ---------- */
loginBtn.addEventListener('click', () => { if (changePassMode) exitChangePassMode(); else doLogin(); });
if (changePassBtn) changePassBtn.addEventListener('click', () => { if (changePassMode) doChangePassword(); else enterChangePassMode(); });

[loginEmail, loginPassword].forEach((input) => {
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !changePassMode) doLogin(); });
});

if (window.google && google.accounts) renderGoogleBtn();
})();
</script>
</body>
</html>
