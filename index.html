<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kem Đoàn</title>
<link rel="icon" type="image/png" href="kemdoan.jpg">
<link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet">
<style>
  * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }

  :root {
    --bg: #fff;
    --surface: #f5f5f5;
    --text: #444;
    --text-muted: #bdbdbd;
    --green-pastel: #89ddba;
    --green-pastel-hover: #4dd29b;
    --green-icon: #fff;
    --shadow-soft: 0 2px 10px rgba(0, 0, 0, 0.06);
  }

  html, body { height: 100%; }
  body {
    font-family: -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    margin: 0;
    padding: 30px 20px;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  .content { flex: 1; }

  .logo-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-bottom: 24px;
  }
  .logo-img {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    border: 3px solid #fff;
    box-shadow: 0 4px 14px rgba(0,0,0,0.15);
    object-fit: cover;
    background: #ddd;
  }
  .logo-text {
    margin-top: 10px;
    font-size: 20px;
    font-weight: 600;
    color: #444;
  }

  .search-wrap {
    position: relative;
    max-width: 480px;
    margin: 0 auto;
  }
  .search-icon {
    position: absolute;
    left: 18px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 20px;
    line-height: 1;
    color: var(--text-muted);
    pointer-events: none;
  }
  #search {
    width: 100%;
    padding: 14px 44px 14px 46px;
    font-size: 16px;
    border: none;
    border-radius: 50px;
    outline: none;
    background: var(--surface);
    color: var(--text);
  }
  #search::placeholder { color: var(--text-muted); }

  #clear-btn {
    position: absolute;
    right: 14px;
    top: 50%;
    transform: translateY(-50%);
    width: 22px;
    height: 22px;
    border: none;
    background: #d2d2d8;
    color: #fff;
    border-radius: 50%;
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 0;
  }
  #clear-btn.show { display: flex; }
  #clear-btn i { font-size: 14px; line-height: 1; }

  #results {
    max-width: 480px;
    margin: 20px auto 0;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .font-item {
    background: var(--surface);
    border-radius: 50px;
    padding: 8px 8px 8px 22px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
  }
  .font-name {
    font-size: 15px;
    min-width: 0;
    overflow-wrap: anywhere;
  }
  .download-btn {
    flex-shrink: 0;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: var(--green-pastel);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    font-size: 20px;
    transition: background 0.15s ease, transform 0.15s ease;
  }
  .download-btn i { line-height: 1; }
  .download-btn:hover { background: var(--green-pastel-hover); }
  .download-btn:active { transform: scale(0.94); }

  #status {
    text-align: center;
    color: #888;
    margin-top: 16px;
    font-size: 14px;
  }

  .login-panel {
    max-width: 340px;
    margin: 60px auto 0;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .login-icon {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    background: var(--surface);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    color: var(--text-muted);
    box-shadow: var(--shadow-soft);
  }
  .login-title {
    margin-top: 12px;
    font-size: 18px;
    font-weight: 600;
    color: #444;
  }
  .login-input-wrap {
    position: relative;
    width: 100%;
    margin-top: 24px;
  }
  .login-input-icon {
    position: absolute;
    left: 18px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 18px;
    color: var(--text-muted);
    pointer-events: none;
  }
  #login-email {
    width: 100%;
    padding: 14px 18px 14px 46px;
    font-size: 15px;
    border: none;
    border-radius: 50px;
    outline: none;
    background: var(--surface);
    color: var(--text);
  }
  #login-email::placeholder { color: var(--text-muted); }

  #login-btn {
    width: 100%;
    margin-top: 14px;
    padding: 14px 0;
    border: none;
    border-radius: 50px;
    background: var(--green-pastel);
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.15s ease;
  }
  #login-btn:hover { background: var(--green-pastel-hover); }
  #login-btn:active { transform: scale(0.97); }
  #login-btn i { font-size: 18px; line-height: 1; }
  #login-btn:disabled { opacity: 0.6; cursor: default; }

  #login-error {
    margin-top: 14px;
    color: #e05252;
    font-size: 13px;
    text-align: center;
    min-height: 16px;
  }
</style>
</head>
<body>

  <div class="login-panel" id="login-panel" style="display:none;">
    <div class="login-icon"><i class="ri-user-3-line"></i></div>
    <div class="login-title">Thành viên</div>
    <div class="login-input-wrap">
      <i class="ri-mail-line login-input-icon"></i>
      <input type="email" id="login-email" placeholder="Nhập mail của bạn">
    </div>
    <button id="login-btn"><i class="ri-arrow-right-line"></i> Đăng nhập</button>
    <div id="login-error"></div>
  </div>

  <div class="content" id="content" style="display:none;">
    <div class="logo-wrap">
      <img src="kemdoan.jpg" alt="logo" class="logo-img">
      <div class="logo-text">Kem Đoàn</div>
    </div>

    <div class="search-wrap">
      <i class="ri-search-line search-icon"></i>
      <input type="text" id="search" placeholder="Nhập tên font...">
      <button id="clear-btn"><i class="ri-close-line"></i></button>
    </div>

    <div id="results"></div>
    <div id="status"></div>
  </div>


<script>
let allFonts = [];
const searchInput = document.getElementById('search');
const clearBtn = document.getElementById('clear-btn');
const statusEl = document.getElementById('status');
const loginPanel = document.getElementById('login-panel');
const contentEl = document.getElementById('content');
const loginEmail = document.getElementById('login-email');
const loginBtn = document.getElementById('login-btn');
const loginError = document.getElementById('login-error');

function showApp() {
  loginPanel.style.display = 'none';
  contentEl.style.display = '';
  loadManifest();
}

function showLogin() {
  contentEl.style.display = 'none';
  loginPanel.style.display = 'flex';
}

function loadManifest() {
  fetch('manifest.json')
    .then(res => res.json())
    .then(data => {
      allFonts = data;
    })
    .catch(err => {
      statusEl.textContent = 'Lỗi tải manifest.json: ' + err;
    });
}

// Kiểm tra đã đăng nhập trước đó chưa (lưu vĩnh viễn trên máy)
if (localStorage.getItem('kd_logged_in') === '1') {
  showApp();
} else {
  showLogin();
}

function doLogin() {
  const email = loginEmail.value.trim().toLowerCase();
  loginError.textContent = '';

  if (!email) {
    loginError.textContent = 'Vui lòng nhập email';
    return;
  }

  loginBtn.disabled = true;
  loginBtn.textContent = 'Đang kiểm tra...';

  fetch('/api/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email })
  })
    .then(res => res.json())
    .then(data => {
      if (data.ok) {
        localStorage.setItem('kd_logged_in', '1');
        showApp();
      } else {
        loginError.textContent = 'Email không có quyền truy cập';
      }
    })
    .catch(() => {
      loginError.textContent = 'Lỗi kết nối, thử lại sau';
    })
    .finally(() => {
      loginBtn.disabled = false;
      loginBtn.innerHTML = 'Đăng nhập <i class="ri-arrow-right-line"></i>';
    });
}

loginBtn.addEventListener('click', doLogin);
loginEmail.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') doLogin();
});

function render(list) {
  const container = document.getElementById('results');
  container.innerHTML = '';

  if (list.length === 0) {
    statusEl.innerHTML = '<b>KHÔNG TÌM THẤY FONT</b><br><br><i>( Vui lòng nhập chính xác tên font<br>hoặc font chưa được cập nhật )</i>';
    return;
  }

  statusEl.textContent = '';
  list.forEach(font => {
    const div = document.createElement('div');
    div.className = 'font-item';
    div.innerHTML = `
      <span class="font-name">${font.name}</span>
      <a class="download-btn" href="/api/download?file=${encodeURIComponent(font.file)}" download aria-label="Tải font"><i class="ri-download-cloud-2-line"></i></a>
    `;
    container.appendChild(div);
  });
}

// Chuẩn hóa chuỗi: bỏ khoảng trắng, gạch ngang, gạch dưới, viết thường hết
function normalize(str) {
  return str.toLowerCase().replace(/[\s\-_]+/g, '');
}

searchInput.addEventListener('input', (e) => {
  const raw = e.target.value.trim();
  clearBtn.classList.toggle('show', raw.length > 0);

  if (!raw) {
    document.getElementById('results').innerHTML = '';
    statusEl.textContent = '';
    return;
  }

  const q = normalize(raw);
  const filtered = allFonts.filter(f => normalize(f.name).includes(q));
  render(filtered.slice(0, 100));
});

clearBtn.addEventListener('click', () => {
  searchInput.value = '';
  clearBtn.classList.remove('show');
  document.getElementById('results').innerHTML = '';
  statusEl.textContent = '';
  searchInput.focus();
});
</script>
</body>
</html>
