<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kem Đoàn</title>
<link rel="icon" type="image/png" href="kemdoan.jpg">
<link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet">
<style>
  * {  -webkit-tap-highlight-color: transparent; }

  :root {
    --bg: #efefef;
    --text: #504d69;
    --text-muted: #7f88a9;
    --accent: #584838;
    --green: #1fabb3;
    --buy: #747dff;
    --free: #ff7398;
    --box-shadow-img:
       8px 8px 16px #d9dae0;
    --box-shadow:
         8px 8px 16px #d9dae0,
        -8px -8px 16px #fff;
    --box-shadow-btn:
        6px 6px 12px #d9dae0,
        -6px -6px 12px #fff;
    --active-btn:
        inset 6px 6px 8px #d9dae0,
        inset -6px -6px 8px #fff;
    --bluegradient: linear-gradient(90deg, #9994ff, #666fff);
    --yellowgradient: linear-gradient(90deg, #ffde68, #ffb179);
    --greengradient: linear-gradient(90deg, #67ffeb, #4ad8e8);
    --pinkgradient: linear-gradient(90deg, #ff9eb6, #ff6990);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    margin: 0;
    padding: 30px 20px;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  .content { flex: 1; }

  .logo-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-bottom: 24px;
  }
  .logo-img {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    border: 4px solid #fff;
    box-shadow: 0 4px 14px rgba(0,0,0,0.15);
    object-fit: cover;
    background: #ddd;
  }
  .logo-text {
    margin-top: 10px;
    font-size: 20px;
    font-weight: 600;
    color: #222;
  }

  .search-wrap {
    position: relative;
    max-width: 480px;
    margin: 0 auto;
  }
  #search {
    width: 100%;
    padding: 14px 44px 14px 20px;
    font-size: 16px;
    border: none;
    border-radius: 50px;
    outline: none;
    background: var(--bg);
    color: var(--text);
    box-shadow: var(--active-btn);
  }
  #search::placeholder {
    color: var(--text-muted);
  }
  #search:focus {
    box-shadow: var(--active-btn);
  }
  #clear-btn {
    position: absolute;
    right: 14px;
    top: 50%;
    transform: translateY(-50%);
    width: 22px;
    height: 22px;
    border: none;
    background: #ccc;
    color: #fff;
    border-radius: 50%;
    font-size: 14px;
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 0;
  }
  #clear-btn.show { display: flex; }
  #clear-btn i { font-size: 14px; line-height: 1; }

  .hint {
    text-align: center;
    color: #999;
    font-size: 13px;
    margin-top: 10px;
  }

  #results {
    max-width: 480px;
    margin: 20px auto 0;
    display: flex;
    flex-direction: column;
    gap: 10px;
    background: transparent;
  }
  .font-item {
    background: var(--bg);
    border-radius: 14px;
    padding: 14px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: var(--box-shadow);
  }
  .font-name { font-size: 15px; }
  .download-btn {
    background: var(--bluegradient);
    color: white;
    border: none;
    padding: 8px 16px;
    border-radius: 10px;
    text-decoration: none;
    font-size: 14px;
    font-weight: 600;
    white-space: nowrap;
    box-shadow: var(--box-shadow-btn);
    transition: box-shadow 0.15s ease, transform 0.15s ease;
  }
  .download-btn:hover {
    box-shadow: var(--active-btn);
  }
  .download-btn:active {
    box-shadow: var(--active-btn);
    transform: translateY(1px);
  }
  #status {
    text-align: center;
    color: #888;
    margin-top: 16px;
    font-size: 14px;
  }

  footer {
    text-align: center;
    color: #aaa;
    font-size: 13px;
    padding: 20px 0 4px;
  }
</style>
</head>
<body>

  <div class="content">
    <div class="logo-wrap">
      <img src="kemdoan.jpg" alt="logo" class="logo-img">
      <div class="logo-text">Kem Đoàn</div>
    </div>

    <div class="search-wrap">
      <input type="text" id="search" placeholder="nhập tên font...">
      <button id="clear-btn"><i class="ri-close-line"></i></button>
    </div>
    <div class="hint">Chỉ cần nhập font thôi Quỳnh bờm 🤣</div>

    <div id="results"></div>
    <div id="status"></div>
  </div>

  <footer>© Kem Đoàn</footer>

<script>
let allFonts = [];
const searchInput = document.getElementById('search');
const clearBtn = document.getElementById('clear-btn');
const statusEl = document.getElementById('status');

fetch('manifest.json')
  .then(res => res.json())
  .then(data => {
    allFonts = data;
  })
  .catch(err => {
    statusEl.textContent = 'Lỗi tải manifest.json: ' + err;
  });

function render(list) {
  const container = document.getElementById('results');
  container.innerHTML = '';

  if (list.length === 0) {
    statusEl.textContent = 'Không tìm thấy font nào.';
    return;
  }

  statusEl.textContent = '';
  list.forEach(font => {
    const div = document.createElement('div');
    div.className = 'font-item';
    div.innerHTML = `
      <span class="font-name">${font.name}</span>
      <a class="download-btn" href="/api/download?file=${encodeURIComponent(font.file)}" download>Tải</a>
    `;
    container.appendChild(div);
  });
}

searchInput.addEventListener('input', (e) => {
  const q = e.target.value.toLowerCase().trim();
  clearBtn.classList.toggle('show', q.length > 0);

  if (!q) {
    document.getElementById('results').innerHTML = '';
    statusEl.textContent = '';
    return;
  }

  const filtered = allFonts.filter(f => f.name.toLowerCase().includes(q));
  render(filtered.slice(0, 100));
});

clearBtn.addEventListener('click', () => {
  searchInput.value = '';
  clearBtn.classList.remove('show');
  document.getElementById('results').innerHTML = '';
  statusEl.textContent = '';
  searchInput.focus();
});
</script>
</body>
</html>
