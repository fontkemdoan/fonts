<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Font - Kem Đoàn</title>
<link rel="icon" type="image" href="kemdoan.jpg">
<link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet">
<style>
  * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }

  :root {
    --bg: #fff;
    --surface: #f5f5f5;
    --text: #555;
    --text-muted: #bdbdbd;
    --green: linear-gradient(90deg, #7be0b5, #3ed194);
    --pink: linear-gradient(90deg, #ff998b, #ff728f);
    --grey: linear-gradient(90deg, #909090, #606060);
    --shadow-soft: 0 4px 10px rgba(0, 0, 0, 0.14);
    --shadow-card: 0 6px 30px rgba(0, 0, 0, 0.1);
  }

  html, body { height: 100%; }
  
  body {
    font-family: -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    margin: 0;
    padding: 30px 20px;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    min-height: 100dvh;
  }

  .content { flex: 1; }

  .logo-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-bottom: 24px;
  }
  
  .logo-img {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    border: 3px solid #fff;
    box-shadow: var(--shadow-soft);
    object-fit: cover;
    background: #ddd;
  }
  
  .logo-text {
    margin-top: 10px;
    font-size: 20px;
    font-weight: 600;
    color: var(--text);
  }

  .search-wrap {
    position: relative;
    max-width: 480px;
    margin: 0 auto;
  }
  
  .search-icon {
    position: absolute;
    left: 18px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 20px;
    line-height: 1;
    color: var(--text-muted);
    pointer-events: none;
  }
  
  #search {
    width: 100%;
    padding: 14px 44px 14px 46px;
    font-size: 16px;
    border: none;
    border-radius: 50px;
    outline: none;
    background: var(--surface);
    color: var(--text);
  }
  
  #search::placeholder {
    color: var(--text-muted);
  }

  #clear-btn {
    position: absolute;
    right: 14px;
    top: 50%;
    transform: translateY(-50%);
    width: 22px;
    height: 22px;
    border: none;
    background: #d2d2d8;
    color: #fff;
    border-radius: 50%;
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 0;
  }
  
  #clear-btn.show {
    display: flex;
  }
  
  #clear-btn i {
    font-size: 14px;
    line-height: 1;
  }

  #results {
    max-width: 480px;
    margin: 12px auto 0;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  
  .font-item {
    background: var(--surface);
    border-radius: 50px;
    padding: 8px 8px 8px 22px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
  }
  
  .font-name {
    font-size: 15px;
    min-width: 0;
    overflow-wrap: anywhere;
  }
  
  .download-btn {
    flex-shrink: 0;
    width: 33px;
    height: 33px;
    border-radius: 50%;
    background: var(--green);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    font-size: 17px;
    transition: background 0.15s ease, transform 0.15s ease;
  }
  
  .download-btn i {
    line-height: 1;
  }
  
  .download-btn:hover {
    background: var(--pink);
  }
  
  .download-btn:active {
    transform: scale(0.94);
  }

  #status {
    text-align: center;
    color: #888;
    margin-top: 16px;
    font-size: 14px;
  }

  .login-panel {
    flex: 1;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  
  .login-card {
    position: relative;
    width: 100%;
    max-width: 340px;
    background: #f4f4f4;
    border-radius: 30px;
    padding: 70px 32px 36px;
    display: flex;
    flex-direction: column;
    align-items: center;
    box-shadow: var(--shadow-card), inset 0 0 6px 3px rgba(255, 255, 255, 1);
}
  
  .login-icon {
    position: absolute;
    top: -50px;
    left: 50%;
    transform: translateX(-50%);
    width: 100px;
    height: 100px;
    border-radius: 50%;
    background: var(--grey);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 40px;
    color: var(--bg);
    border: 3px solid #fff;
    box-shadow: var(--shadow-soft);
    overflow: hidden;
  }
  
  .login-icon img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  
  .login-title {
    margin-top: 0;
    font-size: 18px;
    font-weight: 600;
    color: var(--text);
  }
  
  .login-input-wrap {
    position: relative;
    width: 100%;
    margin-top: 24px;
  }
  
  .login-input-icon {
    position: absolute;
    left: 18px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 18px;
    color: var(--text-muted);
    pointer-events: none;
  }
  
  #login-email {
    width: 100%;
    padding: 14px 18px 14px 46px;
    font-size: 15px;
    border: none;
    border-radius: 50px;
    outline: none;
    background: var(--bg);
    color: var(--text);
  }
  
  #login-email::placeholder {
    color: var(--text-muted);
    font-style: italic;
  }

  #login-email:-webkit-autofill,
  #login-email:-webkit-autofill:hover,
  #login-email:-webkit-autofill:focus {
    -webkit-box-shadow: 0 0 0 1000px var(--bg) inset;
    -webkit-text-fill-color: var(--text);
    transition: background-color 9999s ease-in-out 0s;
  }

  #login-btn {
    width: 100%;
    margin-top: 14px;
    padding: 14px 0;
    border: none;
    border-radius: 50px;
    background: var(--green);
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.15s ease;
  }
  
  #login-btn:active {
    transform: scale(0.94);
  }
  
  #login-btn i {
    font-size: 18px;
    line-height: 1;
  }
  
  #login-btn:disabled {
    cursor: default;
  }

  #login-error {
    margin-top: 14px;
    color: #666;
    font-size: 14px;
    text-align: center;
    height: 20px;
    overflow: hidden;
  }

  @keyframes kd-spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  .kd-spinner {
    display: inline-block;
    animation: kd-spin 0.8s linear infinite;
    font-size: 18px;
    line-height: 1;
  }
  
</style>
</head>
<body>

  <div id="boot-loading" style="flex:1; display:flex; align-items:center; justify-content:center;">
    <i class="ri-loader-4-line kd-spinner" style="font-size:36px; color: var(--text-muted);"></i>
  </div>

  <div class="login-panel" id="login-panel" style="display:none;">
    <div class="login-card">
      <div class="login-icon" id="login-icon"><i class="ri-user-line"></i></div>
      <div class="login-title">Thành viên</div>
      <div class="login-input-wrap">
        <i class="ri-user-fill login-input-icon"></i>
        <input type="email" id="login-email" placeholder="abcd@gmail.com">
      </div>
      <button id="login-btn"><i class="ri-arrow-right-line"></i> Đăng nhập</button>
      <div id="login-error"></div>
    </div>
  </div>

  <div class="content" id="content" style="display:none;">
    <div class="logo-wrap">
      <img src="kemdoan.jpg" alt="logo" class="logo-img">
      <div class="logo-text">Font - Kem Đoàn</div>
    </div>

    <div class="search-wrap">
      <i class="ri-search-line search-icon"></i>
      <input type="text" id="search" placeholder="Nhập tên font...">
      <button id="clear-btn"><i class="ri-close-line"></i></button>
    </div>

    <div id="results"></div>
    <div id="status"></div>
  </div>


<script>
let allFonts = [];
const searchInput = document.getElementById('search');
const clearBtn = document.getElementById('clear-btn');
const statusEl = document.getElementById('status');
const loginPanel = document.getElementById('login-panel');
const contentEl = document.getElementById('content');
const loginEmail = document.getElementById('login-email');
const loginBtn = document.getElementById('login-btn');
const loginError = document.getElementById('login-error');

function showApp() {
  loginPanel.style.display = 'none';
  contentEl.style.display = '';
  loadManifest();
}

function showLogin() {
  contentEl.style.display = 'none';
  loginPanel.style.display = 'flex';
}

function loadManifest() {
  fetch('manifest.json')
    .then(res => res.json())
    .then(data => {
      allFonts = data;
    })
    .catch(err => {
      statusEl.textContent = 'Lỗi tải manifest.json: ' + err;
    });
}

// Sinh (hoặc lấy lại) mã định danh máy, lưu vĩnh viễn trên trình duyệt này
function getDeviceId() {
  let id = localStorage.getItem('kd_device_id');
  if (!id) {
    id = (crypto.randomUUID ? crypto.randomUUID() : 'dev-' + Math.random().toString(36).slice(2) + Date.now());
    localStorage.setItem('kd_device_id', id);
  }
  return id;
}
const deviceId = getDeviceId();

// Mỗi lần vào trang, xác minh lại với server (không chỉ tin localStorage)
// -> nếu email đã bị xóa khỏi emails.json, người dùng sẽ bị đăng xuất ngay
function verifyAndBoot() {
  const loggedIn = localStorage.getItem('kd_logged_in') === '1';
  const storedEmail = localStorage.getItem('kd_email');
  const bootLoading = document.getElementById('boot-loading');

  if (!loggedIn || !storedEmail) {
    bootLoading.style.display = 'none';
    showLogin();
    return;
  }

  fetch('/api/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email: storedEmail, deviceId, mode: 'login' })
  })
    .then(res => res.json())
    .then(data => {
      bootLoading.style.display = 'none';
      if (data.ok) {
        showApp();
      } else {
        localStorage.removeItem('kd_logged_in');
        localStorage.removeItem('kd_email');
        showLogin();
      }
    })
    .catch(() => {
      // Lỗi mạng tạm thời: không đăng xuất oan, cứ cho vào bình thường
      bootLoading.style.display = 'none';
      showApp();
    });
}

verifyAndBoot();

let loginErrorTimer = null;
function showLoginError(msg) {
  loginError.textContent = msg;
  clearTimeout(loginErrorTimer);
  loginErrorTimer = setTimeout(() => {
    loginError.textContent = '';
  }, 2000);
}

// Thời gian tối thiểu hiện icon xoay khi đăng nhập (ms) - có thể đổi số này sau này
const MIN_LOGIN_LOADING_MS = 1500;

function doLogin() {
  const email = loginEmail.value.trim().toLowerCase();
  loginError.textContent = '';

  if (!email) {
    showLoginError('Vui lòng nhập email');
    return;
  }

  loginBtn.disabled = true;
  loginBtn.innerHTML = '<i class="ri-loader-4-line kd-spinner"></i>';

  const startTime = Date.now();

  fetch('/api/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email, deviceId, mode: 'login' })
  })
    .then(res => res.json())
    .then(data => {
      const elapsed = Date.now() - startTime;
      const remaining = MIN_LOGIN_LOADING_MS - elapsed;

      const finish = () => {
        if (data.ok) {
          localStorage.setItem('kd_logged_in', '1');
          localStorage.setItem('kd_email', email);
          showApp();
        } else if (data.error === 'device_mismatch') {
          showLoginError('Email này đã đăng nhập trên thiết bị khác');
        } else {
          showLoginError('Tài khoản không tồn tại');
        }
        loginBtn.disabled = false;
        loginBtn.innerHTML = '<i class="ri-arrow-right-line"></i> Đăng nhập';
      };

      if (remaining > 0) {
        setTimeout(finish, remaining);
      } else {
        finish();
      }
    })
    .catch(() => {
      const elapsed = Date.now() - startTime;
      const remaining = MIN_LOGIN_LOADING_MS - elapsed;

      const finish = () => {
        showLoginError('Lỗi kết nối, thử lại sau');
        loginBtn.disabled = false;
        loginBtn.innerHTML = '<i class="ri-arrow-right-line"></i> Đăng nhập';
      };

      if (remaining > 0) {
        setTimeout(finish, remaining);
      } else {
        finish();
      }
    });
}

loginBtn.addEventListener('click', doLogin);
loginEmail.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') doLogin();
});

const loginIcon = document.getElementById('login-icon');
const loginTitle = document.querySelector('.login-title');
const DEFAULT_TITLE = 'Thành viên';
const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
let previewTimer = null;

function resetLoginIcon() {
  loginIcon.innerHTML = '<i class="ri-user-line"></i>';
  loginTitle.textContent = DEFAULT_TITLE;
}

function previewAvatar(email) {
  fetch('/api/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email, mode: 'preview' })
  })
    .then(res => res.json())
    .then(data => {
      if (data.ok) {
        if (data.avatar) {
          loginIcon.innerHTML = `<img src="avatars/${data.avatar}" alt="avatar">`;
        }
        loginTitle.textContent = data.name || DEFAULT_TITLE;
      } else {
        resetLoginIcon();
      }
    })
    .catch(() => resetLoginIcon());
}

loginEmail.addEventListener('input', () => {
  clearTimeout(previewTimer);
  const val = loginEmail.value.trim().toLowerCase();
  if (!emailRegex.test(val)) {
    resetLoginIcon();
    return;
  }
  previewTimer = setTimeout(() => previewAvatar(val), 400);
});

function render(list) {
  const container = document.getElementById('results');
  container.innerHTML = '';

  if (list.length === 0) {
    statusEl.innerHTML = '<b>KHÔNG TÌM THẤY FONT</b><br><br><i>( Vui lòng nhập chính xác tên font<br>hoặc font chưa được cập nhật )</i>';
    return;
  }

  statusEl.textContent = '';
  list.forEach(font => {
    const div = document.createElement('div');
    div.className = 'font-item';
    div.innerHTML = `
      <span class="font-name">${font.name}</span>
      <a class="download-btn" href="/api/download?file=${encodeURIComponent(font.file)}" download aria-label="Tải font"><i class="ri-download-cloud-2-line"></i></a>
    `;
    container.appendChild(div);
  });
}

// Chuẩn hóa chuỗi: bỏ khoảng trắng, gạch ngang, gạch dưới, viết thường hết
function normalize(str) {
  return str.toLowerCase().replace(/[\s\-_]+/g, '');
}

searchInput.addEventListener('input', (e) => {
  const raw = e.target.value.trim();
  clearBtn.classList.toggle('show', raw.length > 0);

  if (!raw) {
    document.getElementById('results').innerHTML = '';
    statusEl.textContent = '';
    return;
  }

  const q = normalize(raw);
  const filtered = allFonts.filter(f => normalize(f.name).includes(q));
  render(filtered.slice(0, 100));
});

clearBtn.addEventListener('click', () => {
  searchInput.value = '';
  clearBtn.classList.remove('show');
  document.getElementById('results').innerHTML = '';
  statusEl.textContent = '';
  searchInput.focus();
});
</script>
</body>
</html>
