<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
<script>
  try {
    const t = localStorage.getItem('kd_theme');
    if (t === 'dark' || t === 'light') {
      document.documentElement.setAttribute('data-theme', t);
    }
  } catch (e) {}
</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kem Đoàn</title>
<link rel="icon" href="img/kemdoan.jpg">
<link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="bottom-fade"></div>

  <div class="bottom-nav" id="bottom-nav">
    <button class="nav-btn" id="theme-toggle" aria-label="Đổi giao diện sáng/tối"><i class="ri-sun-line"></i></button>
    <a class="nav-btn" href="https://www.facebook.com/fontkemdoan" target="_blank" rel="noopener" aria-label="Messenger"><i class="ri-messenger-line"></i></a>
    <a class="nav-btn" href="https://www.facebook.com/fontkemdoan" target="_blank" rel="noopener" aria-label="Facebook"><i class="ri-facebook-fill"></i></a>
     <a class="nav-btn nav-text" href="https://zalo.me/0559970246" target="_blank" rel="noopener" aria-label="Nhắn tin">Zalo</a>
    <button class="nav-btn" id="logout-btn" aria-label="Đăng xuất"><i class="ri-logout-box-line"></i></button>
  </div>

  <div id="boot-loading" style="flex:1; display:flex; align-items:center; justify-content:center;">
    <i class="ri-loader-4-line kd-spinner" style="font-size:36px; color: var(--text);"></i>
  </div>

  <div class="login-logo" id="brand-header" style="display:none;">
    <img src="img/kemdoanwhite.png" alt="logo" class="brand-logo-img">
    <div class="login-logo-text">
      <div class="login-logo-name">KEM ĐOÀN</div>
      <div class="login-logo-slogan">Font Việt hóa</div>
    </div>
  </div>

  <div class="login-panel" id="login-panel" style="display:none;">
    <div class="login-card">
      <div class="login-icon" id="login-icon"><i class="ri-user-line"></i></div>
      <div class="login-title">Thành Viên</div>
      <div class="login-input-wrap">
        <i class="ri-user-line login-input-icon"></i>
        <input type="email" id="login-email" placeholder="abcd@gmail.com" autocapitalize="off" autocorrect="off" spellcheck="false">
      </div>
      <div class="login-input-wrap">
        <i class="ri-lock-line login-input-icon"></i>
        <input type="password" id="login-password" placeholder="Mật khẩu">
      </div>
      <div class="login-input-wrap" id="change-pass-extra" style="display:none;">
        <i class="ri-lock-line login-input-icon"></i>
        <input type="password" id="new-password" placeholder="Mật khẩu mới">
      </div>
      <div class="login-btn-row">
        <button id="change-pass-btn"><i class="ri-key-2-line"></i> Đổi Pass</button>
        <button id="login-btn"><i class="ri-arrow-right-line"></i> Đăng nhập</button>
      </div>
    </div>
    <div id="login-error"></div>
  </div>

  <div class="content" id="content" style="display:none;">
    <div class="login-logo search-brand">
      <img src="img/kemdoanwhite.png" alt="logo" class="brand-logo-img">
      <div class="login-logo-text">
        <div class="login-logo-name">KEM ĐOÀN</div>
        <div class="login-logo-slogan">Font Việt hóa</div>
      </div>
    </div>

    <div class="search-wrap">
      <i class="ri-search-line search-icon"></i>
      <input type="text" id="search" placeholder="Nhập tên font..." autocomplete="off" autocorrect="off" spellcheck="false">
      <button id="clear-btn"><i class="ri-close-line"></i></button>
    </div>

    <div id="families" class="hidden"></div>
    <div id="results"></div>
    <div id="status"></div>
  </div>

<script src="script.js"></script>
</body>
</html>
