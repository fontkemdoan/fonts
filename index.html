<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kem Đoàn</title>
<link rel="icon" type="image" href="kemdoan.jpg">
<link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet">
<style>
  * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }

  :root {
    --bg: #fff;
    --surface: #f5f5f5;
    --text: #555;
    --text-muted: #bdbdbd;
    --green: linear-gradient(90deg, #7be0b5, #3ed194);
    --pink: linear-gradient(90deg, #ff998b, #ff728f);
    --grey: linear-gradient(90deg, #909090, #606060);
    --shadow-soft: 0 4px 10px rgba(0, 0, 0, 0.14);
    --shadow-card: 0 6px 30px rgba(0, 0, 0, 0.1);
  }

  html, body { height: 100%; }
  
  body {
    font-family: -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    margin: 0;
    padding: 30px 20px;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    min-height: 100dvh;
  }

  .content { flex: 1; }

  .logo-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-bottom: 24px;
  }
  
  .logo-img {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    border: 3px solid #fff;
    box-shadow: var(--shadow-soft);
    object-fit: cover;
    background: #ddd;
  }
  
  .logo-text {
    margin-top: 10px;
    font-size: 20px;
    font-weight: 600;
    color: var(--text);
  }

  .search-wrap {
    position: relative;
    max-width: 480px;
    margin: 0 auto;
  }
  
  .search-icon {
    position: absolute;
    left: 18px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 20px;
    line-height: 1;
    color: var(--text-muted);
    pointer-events: none;
  }
  
  #search {
    width: 100%;
    padding: 14px 44px 14px 46px;
    font-size: 16px;
    border: none;
    border-radius: 50px;
    outline: none;
    background: var(--surface);
    color: var(--text);
  }
  
  #search::placeholder {
    color: var(--text-muted);
  }

  #clear-btn {
    position: absolute;
    right: 14px;
    top: 50%;
    transform: translateY(-50%);
    width: 22px;
    height: 22px;
    border: none;
    background: #d2d2d8;
    color: #fff;
    border-radius: 50%;
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 0;
  }
  
  #clear-btn.show {
    display: flex;
  }
  
  #clear-btn i {
    font-size: 14px;
    line-height: 1;
  }

  #results {
    max-width: 480px;
    margin: 12px auto 0;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  
  .font-item {
    background: var(--surface);
    border-radius: 50px;
    padding: 8px 8px 8px 22px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
  }
  
  .font-name {
    font-size: 15px;
    min-width: 0;
    overflow-wrap: anywhere;
  }
  
  .download-btn {
    flex-shrink: 0;
    width: 33px;
    height: 33px;
    border-radius: 50%;
    background: var(--green);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    font-size: 17px;
    transition: background 0.15s ease, transform 0.15s ease;
  }
  
  .download-btn i {
    line-height: 1;
  }
  
  .download-btn:hover {
    background: var(--pink);
  }
  
  .download-btn:active {
    transform: scale(0.94);
  }

  #status {
    text-align: center;
    color: #888;
    margin-top: 16px;
    font-size: 14px;
  }

  .login-panel {
    flex: 1;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  
  .login-card {
    position: relative;
    width: 100%;
    max-width: 340px;
    background: #f4f4f4;
    border-radius: 30px;
    padding: 70px 32px 36px;
    display: flex;
    flex-direction: column;
    align-items: center;
    box-shadow: var(--shadow-card), inset 0 0 6px 3px rgba(255, 255, 255, 1);
}
  
  .login-icon {
    position: absolute;
    top: -50px;
    left: 50%;
    transform: translateX(-50%);
    width: 100px;
    height: 100px;
    border-radius: 50%;
    background: var(--grey);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 40px;
    color: var(--bg);
    border: 3px solid #fff;
    box-shadow: var(--shadow-soft);
    overflow: hidden;
  }
  
  .login-icon img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  
  .login-title {
    margin-top: 0;
    font-size: 18px;
    font-weight: 600;
    color: var(--text);
  }
  
  .login-input-wrap {
    position: relative;
    width: 100%;
    margin-top: 14px;
  }
  
  .login-input-icon {
    position: absolute;
    left: 18px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 18px;
    color: var(--text-muted);
    pointer-events: none;
  }
  
  #login-email,
  #login-password,
  #new-password {
    width: 100%;
    padding: 14px 18px 14px 46px;
    font-size: 15px;
    border: none;
    border-radius: 50px;
    outline: none;
    background: var(--bg);
    color: var(--text);
  }
  
  #login-email::placeholder,
  #login-password::placeholder,
  #new-password::placeholder {
    color: var(--text-muted);
    font-style: italic;
  }

  #login-email:-webkit-autofill,
  #login-email:-webkit-autofill:hover,
  #login-email:-webkit-autofill:focus,
  #login-password:-webkit-autofill,
  #login-password:-webkit-autofill:hover,
  #login-password:-webkit-autofill:focus {
    -webkit-box-shadow: 0 0 0 1000px var(--bg) inset;
    -webkit-text-fill-color: var(--text);
    transition: background-color 9999s ease-in-out 0s;
  }

  .login-btn-row {
    display: flex;
    gap: 10px;
    width: 100%;
    margin-top: 14px;
  }

  #login-btn,
  #change-pass-btn {
    flex: 1;
    margin-top: 0;
    padding: 14px 0;
    border: none;
    border-radius: 50px;
    font-size: 14px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.15s ease;
  }

  #login-btn,
  #change-pass-btn {
    background: var(--green);
    color: #fff;
  }
  
  #login-btn:active,
  #change-pass-btn:active {
    transform: scale(0.94);
  }
  
  #login-btn i,
  #change-pass-btn i {
    font-size: 18px;
    line-height: 1;
  }
  
  #login-btn:disabled,
  #change-pass-btn:disabled {
    cursor: default;
  }

  #login-error {
    margin-top: 14px;
    color: #666;
    font-size: 14px;
    text-align: center;
    height: 20px;
    overflow: hidden;
  }

  @keyframes kd-spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  .kd-spinner {
    display: inline-block;
    animation: kd-spin 0.8s linear infinite;
    font-size: 18px;
    line-height: 1;
  }
  
</style>
</head>
<body>

  <div class="login-panel" id="login-panel" style="display:none;">
    <div class="login-card">
      <div class="login-icon" id="login-icon"><i class="ri-user-line"></i></div>
      <div class="login-title">Thành viên</div>
      <div class="login-input-wrap">
        <i class="ri-user-fill login-input-icon"></i>
        <input type="email" id="login-email" placeholder="abcd@gmail.com">
      </div>
      <div class="login-input-wrap">
        <i class="ri-lock-line login-input-icon"></i>
        <input type="password" id="login-password" placeholder="Mật khẩu">
      </div>
      <div class="login-input-wrap" id="change-pass-extra" style="display:none;">
        <i class="ri-lock-2-line login-input-icon"></i>
        <input type="password" id="new-password" placeholder="Mật khẩu mới">
      </div>
      <div class="login-btn-row">
        <button id="change-pass-btn"><i class="ri-key-2-line"></i> Đổi Pass</button>
        <button id="login-btn"><i class="ri-arrow-right-line"></i> Đăng nhập</button>
      </div>
      <div id="login-error"></div>
    </div>
  </div>

  <div class="content" id="content" style="display:none;">
    <div class="logo-wrap">
      <img src="kemdoan.jpg" alt="logo" class="logo-img">
      <div class="logo-text">Kem Đoàn</div>
    </div>

    <div class="search-wrap">
      <i class="ri-search-line search-icon"></i>
      <input type="text" id="search" placeholder="Nhập tên font...">
      <button id="clear-btn"><i class="ri-close-line"></i></button>
    </div>

    <div id="results"></div>
    <div id="status"></div>
  </div>


<script>
let allFonts = [];
const searchInput = document.getElementById('search');
const clearBtn = document.getElementById('clear-btn');
const statusEl = document.getElementById('status');
const loginPanel = document.getElementById('login-panel');
const contentEl = document.getElementById('content');
const loginEmail = document.getElementById('login-email');
const loginPassword = document.getElementById('login-password');
const loginBtn = document.getElementById('login-btn');
const loginError = document.getElementById('login-error');
const changePassBtn = document.getElementById('change-pass-btn');
const changePassExtra = document.getElementById('change-pass-extra');
const newPasswordInput = document.getElementById('new-password');

function showApp() {
  loginPanel.style.display = 'none';
  contentEl.style.display = '';
  loadManifest();
}

function showLogin() {
  contentEl.style.display = 'none';
  loginPanel.style.display = 'flex';
}

function loadManifest() {
  fetch('manifest.json')
    .then(res => res.json())
    .then(data => {
      allFonts = data;
    })
    .catch(err => {
      statusEl.textContent = 'Lỗi tải manifest.json: ' + err;
    });
}

// Ghi nhớ đăng nhập vĩnh viễn trên máy này, chỉ mất khi xóa cache trình duyệt
if (localStorage.getItem('kd_logged_in') === '1') {
  showApp();
} else {
  showLogin();
}

let loginErrorTimer = null;
function showLoginError(msg) {
  loginError.textContent = msg;
  clearTimeout(loginErrorTimer);
  loginErrorTimer = setTimeout(() => {
    loginError.textContent = '';
  }, 2000);
}

function doLogin() {
  const email = loginEmail.value.trim().toLowerCase();
  const password = loginPassword.value;
  loginError.textContent = '';

  if (!email || !password) {
    showLoginError('Vui lòng nhập email và mật khẩu');
    return;
  }

  loginBtn.disabled = true;
  loginBtn.innerHTML = '<i class="ri-loader-4-line kd-spinner"></i>';

  fetch('/api/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email, password, mode: 'login' })
  })
    .then(res => res.json())
    .then(data => {
      if (data.ok) {
        localStorage.setItem('kd_logged_in', '1');
        showApp();
      } else if (data.error === 'wrong_password') {
        showLoginError('Sai mật khẩu');
      } else {
        showLoginError('Tài khoản không tồn tại');
      }
    })
    .catch(() => {
      showLoginError('Lỗi kết nối, hãy thử lại sau');
    })
    .finally(() => {
      loginBtn.disabled = false;
      loginBtn.innerHTML = '<i class="ri-arrow-right-line"></i> Đăng nhập';
    });
}

loginBtn.addEventListener('click', () => {
  if (changePassMode) {
    exitChangePassMode();
  } else {
    doLogin();
  }
});
loginEmail.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !changePassMode) doLogin();
});
loginPassword.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !changePassMode) doLogin();
});

// ---- Đổi mật khẩu (không cần đã đăng nhập, chỉ cần email + mật khẩu cũ) ----
let changePassMode = false;

function enterChangePassMode() {
  changePassMode = true;
  changePassExtra.style.display = 'block';
  changePassBtn.innerHTML = '<i class="ri-check-line"></i> Xác nhận';
  loginBtn.innerHTML = '<i class="ri-arrow-left-line"></i> Quay lại';
}

function exitChangePassMode() {
  changePassMode = false;
  changePassExtra.style.display = 'none';
  newPasswordInput.value = '';
  changePassBtn.innerHTML = '<i class="ri-key-2-line"></i> Đổi Pass';
  loginBtn.innerHTML = '<i class="ri-arrow-right-line"></i> Đăng nhập';
}

changePassBtn.addEventListener('click', () => {
  if (!changePassMode) {
    enterChangePassMode();
    return;
  }

  const email = loginEmail.value.trim().toLowerCase();
  const oldPassword = loginPassword.value;
  const newPassword = newPasswordInput.value;

  if (!email || !oldPassword || !newPassword) {
    showLoginError('Vui lòng nhập đầy đủ thông tin');
    return;
  }

  changePassBtn.disabled = true;
  loginBtn.disabled = true;
  changePassBtn.innerHTML = '<i class="ri-loader-4-line kd-spinner"></i>';

  fetch('/api/change-password', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email, oldPassword, newPassword })
  })
    .then(res => res.json())
    .then(data => {
      if (data.ok) {
        showLoginError('Đổi mật khẩu thành công');
        exitChangePassMode();
      } else if (data.error === 'wrong_password') {
        showLoginError('Mật khẩu hiện tại không đúng');
      } else if (data.error === 'not_found') {
        showLoginError('Tài khoản không tồn tại');
      } else {
        showLoginError('Có lỗi xảy ra, thử lại sau');
      }
    })
    .catch(() => showLoginError('Lỗi kết nối, thử lại sau'))
    .finally(() => {
      changePassBtn.disabled = false;
      loginBtn.disabled = false;
      if (changePassMode) changePassBtn.innerHTML = '<i class="ri-check-line"></i> Xác nhận';
    });
});

const loginIcon = document.getElementById('login-icon');
const loginTitle = document.querySelector('.login-title');
const DEFAULT_TITLE = 'Thành viên';
const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
let previewTimer = null;

function resetLoginIcon() {
  loginIcon.innerHTML = '<i class="ri-user-line"></i>';
  loginTitle.textContent = DEFAULT_TITLE;
}

function previewAvatar(email) {
  fetch('/api/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email, mode: 'preview' })
  })
    .then(res => res.json())
    .then(data => {
      if (data.ok) {
        if (data.avatar) {
          loginIcon.innerHTML = `<img src="avatars/${data.avatar}" alt="avatar">`;
        }
        loginTitle.textContent = data.name || DEFAULT_TITLE;
      } else {
        resetLoginIcon();
      }
    })
    .catch(() => resetLoginIcon());
}

loginEmail.addEventListener('input', () => {
  clearTimeout(previewTimer);
  const val = loginEmail.value.trim().toLowerCase();
  if (!emailRegex.test(val)) {
    resetLoginIcon();
    return;
  }
  previewTimer = setTimeout(() => previewAvatar(val), 400);
});

function render(list) {
  const container = document.getElementById('results');
  container.innerHTML = '';

  if (list.length === 0) {
    statusEl.innerHTML = '<b>KHÔNG TÌM THẤY FONT</b><br><br><i>( Vui lòng nhập chính xác tên font<br>hoặc font chưa được cập nhật )</i>';
    return;
  }

  statusEl.textContent = '';
  list.forEach(font => {
    const div = document.createElement('div');
    div.className = 'font-item';
    div.innerHTML = `
      <span class="font-name">${font.name}</span>
      <a class="download-btn" href="/api/download?file=${encodeURIComponent(font.file)}" download aria-label="Tải font"><i class="ri-download-cloud-2-line"></i></a>
    `;
    container.appendChild(div);
  });
}

// Chuẩn hóa chuỗi: bỏ khoảng trắng, gạch ngang, gạch dưới, viết thường hết
function normalize(str) {
  return str.toLowerCase().replace(/[\s\-_]+/g, '');
}

searchInput.addEventListener('input', (e) => {
  const raw = e.target.value.trim();
  clearBtn.classList.toggle('show', raw.length > 0);

  if (!raw) {
    document.getElementById('results').innerHTML = '';
    statusEl.textContent = '';
    return;
  }

  const q = normalize(raw);
  const filtered = allFonts.filter(f => normalize(f.name).includes(q));
  render(filtered.slice(0, 100));
});

clearBtn.addEventListener('click', () => {
  searchInput.value = '';
  clearBtn.classList.remove('show');
  document.getElementById('results').innerHTML = '';
  statusEl.textContent = '';
  searchInput.focus();
});
</script>
</body>
</html>
