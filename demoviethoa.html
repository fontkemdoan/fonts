      `<g transform="translate(0 ${B}) scale(${s} ${-s})"><path d="${acc.d}" fill="#fff" clip-path="url(#${id})"/></g>`;
    letter.appendChild(svg);
    const rect = svg.querySelector('rect'), full = x1 - x0 + 2 * pad;
    await anim(650, e => rect.setAttribute('width', full * e));
    return svg;
  }

  // reveal part of the real glyph (Đ bar via exact mask, or accents above the base letter), left -> right
  async function revealGlyph(row, letter, ch, bb, above) {
    const { H, B } = row.M, w = letter.offsetWidth, OFF = 300;
    const mk_ = Array.isArray(bb) ? null : bb;
    const pad = mk_ ? 0 : 12;
    const r = mk_ ? [mk_.x0, mk_.yBot, mk_.x1, mk_.yTop] : bb;
    const [x0, y0, x1, y1] = [r[0] - pad, r[1] - pad, r[2] + pad, r[3] + pad];
    const o = document.createElement('span'); o.className = 'ovt'; o.textContent = ch;
    o.style.lineHeight = H + 'px'; o.style.height = H + 'px'; if (above) o.style.zIndex = 1;
    o.style.left = -OFF + 'px'; o.style.padding = '0 ' + OFF + 'px';
    if (mk_) {
      const u = 'url(data:image/png;base64,' + mk_.png + ')';
      const size = `${(mk_.x1 - mk_.x0) * s}px ${(mk_.yTop - mk_.yBot) * s}px`;
      const pos = `${OFF + mk_.x0 * s}px ${B - mk_.yTop * s}px`;
      Object.assign(o.style, { maskImage: u, webkitMaskImage: u, maskRepeat: 'no-repeat', webkitMaskRepeat: 'no-repeat',
        maskSize: size, webkitMaskSize: size, maskPosition: pos, webkitMaskPosition: pos });
    }
    const top = B - y1 * s, bottom = H - (B - y0 * s), left = OFF + x0 * s;
    const rightFull = w + OFF - x1 * s, rightStart = w + OFF - x0 * s;
    o.style.clipPath = `inset(${top}px ${rightStart}px ${bottom}px ${left}px)`;
    letter.appendChild(o);
    await anim(750, e => { o.style.clipPath = `inset(${top}px ${rightStart + (rightFull - rightStart) * e}px ${bottom}px ${left}px)`; });
    (row.pending = row.pending || new Map());
    const pe = row.pending.get(letter) || { overlays: [] }; pe.ch = ch; pe.overlays.push(o); row.pending.set(letter, pe);
    return o;
  }

  // once every accent in the row is drawn, turn them all white and swap in the real characters
  const settleRow = async row => {
    const m = row.pending; if (!m) return;
    m.forEach(e => e.overlays.forEach(o => { o.style.color = '#fff'; }));
    await sleep(100);
    m.forEach((e, letter) => { letter.childNodes[0].nodeValue = e.ch; e.overlays.forEach(o => o.remove()); });
    row.pending = null;
  };

  const finish = (letter, ch) => { letter.childNodes[0].nodeValue = ch; letter.querySelectorAll('svg.ov, .ovt').forEach(n => n.remove()); };

  async function play() {
  const top = makeRow('KDKae'), bot = makeRow('KDDoan', true);

  // 1. guide lines first
  await sleep(200);
  [...top.guides, ...bot.guides].forEach((g, i) => setTimeout(() => g.classList.add('on'), i * 40));
  await sleep(900);

  // 2. top row: Kem Doan (KD Kaelyna Script) -> Kem Đoàn
  top.line.append(top.cursor);
  await type(top.wA, 'Kem'); await sleep(250);
  await type(top.wB, 'Doan');
  top.cursor.remove();
  await sleep(100);
  const tD = top.wB.children[0], ta = top.wB.children[2];
  await revealGlyph(top, tD, 'Đ', MASK.kae, true); await sleep(300);
  await revealGlyph(top, ta, 'à', [-150, 505, ta.offsetWidth / s + 150, 1200]); await sleep(300); await settleRow(top);
  await sleep(100);

  // 3. bottom row: Doan Nguyen (KD Doan Nguyen Bold) -> Đoàn Nguyễn
  bot.line.append(bot.cursor);
  await type(bot.wA, 'Doan'); await sleep(250); await type(bot.wB, 'Nguyen', 110);
  bot.cursor.remove();
  await sleep(900);
  const bD = bot.wA.children[0], ba = bot.wA.children[2], be = bot.wB.children[4];
  await revealGlyph(bot, bD, 'Đ', MASK.doan, true); await sleep(300);
  await revealGlyph(bot, ba, 'à', [-150, 600, ba.offsetWidth / s + 150, 1200]); await sleep(300);
  await revealGlyph(bot, be, 'ê', [-150, 600, be.offsetWidth / s + 150, 1200]); await sleep(300);
  await revealGlyph(bot, be, 'ễ', [-150, 806, be.offsetWidth / s + 150, 1200]); await sleep(300); await settleRow(bot);

  }
  document.body.addEventListener('click', () => location.reload());
  while (true) { await play(); await sleep(3500); rowsEl.innerHTML = ''; }
})();
</script>
